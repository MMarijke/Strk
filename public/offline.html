<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Strk</title>
  <!--
    Standalone on purpose: no CSS file, no font import, no JS.

    This page is only ever reached when the network is unavailable AND the
    app shell is not in the precache, which in practice means a cold first
    visit offline. Anything it referenced externally would also fail to
    load, so the tokens below are inlined copies of --background,
    --foreground, --muted-foreground, --primary and --card from
    src/index.css rather than var() references.

    Kept deliberately plain. A user who reaches this has no data and no
    app; the one useful thing is telling them their streaks are safe,
    because the fear at this moment is that being offline broke something.
  -->
  <style>
    :root {
      color-scheme: light dark;
      --bg: hsl(60 20% 98%);
      --fg: hsl(220 20% 10%);
      --muted: hsl(220 10% 45%);
      --primary: hsl(34 80% 36%);
      --card: hsl(0 0% 100%);
      --border: hsl(220 10% 90%);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: hsl(60 5% 11%);
        --fg: hsl(40 10% 95%);
        --muted: hsl(40 5% 65%);
        --primary: hsl(34 80% 55%);
        --card: hsl(60 5% 14%);
        --border: hsl(60 5% 22%);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Hanken Grotesk', ui-sans-serif, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 22rem;
      text-align: center;
    }
    .mark {
      width: 3.5rem;
      height: 3.5rem;
      margin: 0 auto 1.25rem;
      border-radius: 1rem;
      background: color-mix(in srgb, var(--primary) 12%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    svg { width: 1.75rem; height: 1.75rem; stroke: var(--primary); }
    h1 {
      font-size: 1.375rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
    }
    p { font-size: 0.875rem; line-height: 1.5; color: var(--muted); margin: 0 0 1.5rem; }
    button {
      font: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      width: 100%;
      min-height: 2.75rem;
      padding: 0 1rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .note { font-size: 0.75rem; margin: 1rem 0 0; }
  </style>
</head>
<body>
  <main>
    <!-- Same flame mark the app uses for its tiers, drawn inline. -->
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>
      Strk needs to load once before it can work without a connection.
      Reconnect and open it again — nothing you've tracked is lost.
    </p>
    <button type="button" onclick="location.reload()">Try again</button>
    <p class="note" id="status" role="status"></p>
  </main>
  <script>
    // Reloads itself the moment connectivity returns, so a user who put
    // their phone down does not have to notice and tap.
    addEventListener('online', function () {
      document.getElementById('status').textContent = 'Back online — reloading…';
      location.reload();
    });
  </script>
</body>
</html>
